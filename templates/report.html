<!DOCTYPE html>
<!-- swarm-test report. Fill every double-brace placeholder; the snippets and the vocabulary per mode
     (recette | feature) are in swarm-test SKILL.md, phase 7. Self-contained: no CDN, works via file://. -->
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{--bg:#F6F7F9;--surface:#fff;--line:#E3E6EA;--fg:#14161A;--muted:#5B6270;--accent:#6344FF;
--ok:#1a7f37;--ok-bg:#e8f5ec;--ko:#c0262d;--ko-bg:#fdecec;--warn:#8a5a00;--warn-bg:#fdf3dc;--nt:#5B6270;--nt-bg:#eef0f3;
--grad:linear-gradient(135deg,#B541FA 0%,#7E65FF 50%,#76F6F5 100%);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161A;--surface:#1C1F24;--line:#2C313A;--fg:#E8EAED;--muted:#9AA2AD;--accent:#A492FF;
--ok:#56d364;--ok-bg:#16301f;--ko:#ff7b72;--ko-bg:#3a1a1c;--warn:#e3b341;--warn-bg:#33290f;--nt:#9AA2AD;--nt-bg:#262a31;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.bar{height:3px;background:var(--grad)}
.wrap{max-width:1080px;margin:0 auto;padding:28px 16px 64px}
.brand{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.02em}.brand svg{width:22px;height:22px}
h1{font-size:28px;line-height:1.2;margin:14px 0 4px;letter-spacing:-.01em}.meta{color:var(--muted);font-size:13px;margin:0}
.verdict{margin:24px 0 32px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:18px 22px}
.verdict.ko{--c:var(--ko)}.verdict.warn{--c:var(--warn)}.verdict.ok{--c:var(--ok)}
.verdict h2{margin:0 0 4px;font-size:20px;color:var(--c)}.verdict p{margin:0;color:var(--muted)}.verdict b{color:var(--ko)}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:36px 0 12px}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:10px 14px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}td a{color:inherit;text-decoration:none}td a:hover{color:var(--accent);text-decoration:underline}
.mono{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,monospace}.dim{color:var(--muted)}
.pill{display:inline-block;white-space:nowrap;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;color:var(--c);background:var(--b)}
.pill.ok,.step.ok,.finding.ok{--c:var(--ok);--b:var(--ok-bg)}.pill.ko,.step.ko,.finding.ko{--c:var(--ko);--b:var(--ko-bg)}.pill.warn,.step.warn,.finding.warn{--c:var(--warn);--b:var(--warn-bg)}.pill.nt,.pill.nx,.step.nt,.step.nx,.finding.nt{--c:var(--nt);--b:var(--nt-bg)}
.journey{margin-top:28px}.j-head{display:flex;align-items:center;gap:12px}.j-head h3{margin:0;font-size:18px}.j-meta{margin:2px 0 12px;color:var(--muted);font-size:13px}.clip{display:block;width:100%;border-radius:10px;margin:0 0 14px;background:#111}
code{font:12px ui-monospace,Menlo,monospace;background:var(--nt-bg);padding:1px 6px;border-radius:5px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.step.ko{border-color:color-mix(in srgb,var(--ko) 45%,var(--line))}
summary{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
summary:hover{background:var(--bg)}.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.sid{color:var(--muted)}.st{font-weight:600;flex:1}
.body{display:grid;grid-template-columns:1fr 300px;gap:20px;padding:4px 16px 16px 38px}
.k{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
.action{margin:0 0 12px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{border-radius:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);font-size:14px}
.step.ko .obs{background:var(--ko-bg);border-color:transparent}.step.ko .obs .k{color:var(--ko)}
.finding{margin-top:12px;border-radius:10px;padding:10px 14px;background:var(--b);border-left:4px solid var(--c)}
.finding p{margin:2px 0 0;font-size:14px}.finding .fix{color:var(--muted)}
.f-head{display:flex;align-items:center;gap:8px}.f-lbl{font-size:12px;font-weight:700;color:var(--c)}.seen{font-size:12px;color:var(--muted)}
.thumb{display:block;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);cursor:zoom-in;align-self:start}
.thumb img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.thumb.none{aspect-ratio:16/9;display:grid;place-items:center;color:var(--muted);font-size:13px;cursor:default;border-style:dashed}
.thumb:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
dialog{border:0;padding:0;background:transparent;max-width:94vw}dialog::backdrop{background:rgba(10,12,16,.85)}dialog img{max-width:94vw;max-height:90vh;border-radius:10px;display:block}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
@media (max-width:720px){.body{grid-template-columns:1fr;padding-left:16px}.cmp{grid-template-columns:1fr}h1{font-size:22px}th:nth-child(3),td:nth-child(3){display:none}}
@media print{details{break-inside:avoid}.bar{print-color-adjust:exact}}
</style></head><body><div class="bar"></div><div class="wrap">

<script>
const lb=document.getElementById('lb');
document.querySelectorAll('.thumb[data-src]').forEach(b=>b.addEventListener('click',()=>{lb.querySelector('img').src=b.dataset.src;lb.showModal()}));
lb.addEventListener('click',()=>lb.close());
document.querySelectorAll('td a').forEach(a=>a.addEventListener('click',()=>{const d=document.getElementById(a.getAttribute('href').slice(1));if(d&&d.tagName==='DETAILS')d.open=true}));
